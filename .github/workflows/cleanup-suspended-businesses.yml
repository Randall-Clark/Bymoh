name: Cleanup Suspended Businesses

on:
  schedule:
    # Chaque nuit à 02:00 UTC (22:00 heure Toronto)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permet aussi de lancer manuellement depuis GitHub

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke cleanup-suspended-businesses
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.SUPABASE_FUNCTION_URL }}/cleanup-suspended-businesses")

          echo "HTTP Status: $response"
          echo "Response:"
          cat /tmp/response.json

          if [ "$response" != "200" ]; then
            echo "❌ Cleanup failed with status $response"
            exit 1
          fi

          deleted=$(cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deleted', 0))")
          echo "✅ Boutiques supprimées : $deleted"
